<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>그랑블루 검색 도우미</title><meta name="description" content="레이드와 조건을 클릭해 그랑블루 판타지의 일본어·영문 검색어를 만듭니다."><link rel="icon" type="image/png" href="icon-32.png"><link rel="stylesheet" href="styles.css"></head>
<body>
<main class="app">
  <div class="workspace">
    <section class="boss-panel" aria-label="보스 선택">
      <div class="picker-toolbar" hidden><button id="back-groups" class="quiet" hidden>‹ 그룹 목록</button><p id="picker-title">보스 선택</p></div>
      <div class="picker-content"><div id="categories" class="category-grid" role="group" aria-label="레이드 그룹"></div><div id="bosses" class="boss-list" hidden></div></div>
      <div id="picker-hint" class="picker-pagination" hidden></div>
    </section>
    <section class="options-panel" aria-label="검색 조건">
      <div id="options"></div>
    </section>
  </div>
  <section class="result-panel" aria-label="검색어">
    <div class="result-label"><div class="language-switch" role="group" aria-label="검색 언어"><button id="language-ja" aria-pressed="true">일본어</button><button id="language-en" aria-pressed="false">English</button></div><div class="result-tools"><label><input id="prefix" type="checkbox" checked> 게임명 포함</label><button id="reset" class="reset-button"><span class="reset-icon" aria-hidden="true">⟳</span><span>조건 초기화</span></button></div></div>
    <output id="query" lang="ja" aria-live="polite"></output>
    <div id="summary" class="summary"></div>
    <div class="actions"><button id="copy" class="copy">일본어 복사</button><button id="copy-en" class="copy">영문 복사</button><a id="youtube" aria-label="YouTube 검색" title="YouTube 검색" class="primary" target="_blank" rel="noopener noreferrer"><svg class="site-logo youtube-logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="4" width="22" height="16" rx="5" fill="#ff0033"/><path d="m10 8 6 4-6 4z" fill="#fff"/></svg><span>검색</span></a><a id="google" aria-label="Google 검색" title="Google 검색" target="_blank" rel="noopener noreferrer"><svg class="site-logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285f4" d="M21.6 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.38a4.6 4.6 0 0 1-1.99 3.02v2.51h3.23c1.89-1.74 2.98-4.3 2.98-7.36z"/><path fill="#34a853" d="M12 22c2.7 0 4.96-.9 6.62-2.41l-3.23-2.51c-.9.6-2.05.97-3.39.97-2.6 0-4.81-1.76-5.6-4.13H3.06v2.59A10 10 0 0 0 12 22z"/><path fill="#fbbc05" d="M6.4 13.92a6 6 0 0 1 0-3.84V7.49H3.06a10 10 0 0 0 0 9.02z"/><path fill="#ea4335" d="M12 5.95c1.47 0 2.79.51 3.83 1.51l2.88-2.87A9.62 9.62 0 0 0 12 2a10 10 0 0 0-8.94 5.49l3.34 2.59C7.19 7.71 9.4 5.95 12 5.95z"/></svg><span>검색</span></a><a id="x" aria-label="X 검색" title="X 검색" target="_blank" rel="noopener noreferrer"><svg class="site-logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3L12 14.6 5.5 22H2.3l7.9-9L1.8 2h6.4l4.5 6.8L18.9 2zm-1.1 18h1.7L7.3 4H5.5z"/></svg><span>검색</span></a></div>
    <p id="status" role="status">보스와 조건을 고르면 검색어가 바로 바뀝니다.</p>
  </section>
  <footer>일본어·영문 편성·공략 검색용 · v0.3.3 <a href="download.html">확장프로그램 다운로드</a></footer>
</main>
<script type="module" src="app.js"></script>
</body></html>
